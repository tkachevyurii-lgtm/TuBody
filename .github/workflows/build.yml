
name: TuBody APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TuBody Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          free-disk-space: 'true'
          gradle-cache-read-only: 'false'

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
        run: |
          ./gradlew :app:assembleFdroidDebug --stacktrace --no-configuration-cache

      - name: Upload TuBody APK
        uses: actions/upload-artifact@v4
        with:
          name: TuBody-Android-Debug
          path: app/build/outputs/apk/fdroid/debug/*-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
